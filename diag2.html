<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostic 2</title>
<style>
  body{background:#0d1117;color:#e6edf3;font-family:-apple-system,Helvetica,Arial,sans-serif;margin:0;padding:12px;font-size:12px}
  h2{font-size:15px;margin:14px 0 4px;color:#58a6ff}
  .wrap{overflow-x:auto}
  table{border-collapse:collapse;min-width:100%}
  th,td{text-align:left;padding:4px 8px;border-bottom:1px solid #21262d;white-space:nowrap}
  th{color:#8b949e}
  pre{background:#161b22;padding:8px;border-radius:6px;white-space:pre-wrap;margin:0}
</style>
</head>
<body>
<h1 style="font-size:18px">What is changing in the recorded data?</h1>
<div id="out">Loading...</div>
<script>
var BASE = "https://scanner-relay.tanbir-eam-6ff.workers.dev";
function asList(x){ if(Array.isArray(x)) return x; if(x && Array.isArray(x.data)) return x.data; return []; }
function distinct(a){ var o = {}; a.forEach(function(v){ o[String(v)] = 1; }); return Object.keys(o).length; }
async function go(){
  var out = document.getElementById("out");
  try{
    var rs = await Promise.all([
      fetch(BASE + "/recorder/history?minutes=120").then(function(r){ return r.json(); }),
      fetch(BASE + "/product/specs/?active=true").then(function(r){ return r.json(); })
    ]);
    var hist = rs[0], specs = asList(rs[1]);
    var html = "<pre>Snapshots in last 120 min: " + hist.length + "</pre>";
    ["PBTCURZ50", "PETHULZ50"].forEach(function(sym){
      var sp = specs.filter(function(s){ return s.symbol === sym; })[0];
      if (!sp){ html += "<h2>" + sym + " not found</h2>"; return; }
      var rows = [];
      hist.forEach(function(sn){
        sn[1].forEach(function(r){ if (r[0] === sp.product_id) rows.push([sn[0]].concat(r.slice(1))); });
      });
      html += "<h2>" + sym + " (" + rows.length + " rows)</h2>";
      html += "<pre>Distinct values over the window: mark " + distinct(rows.map(function(r){return r[1];})) +
        ", last " + distinct(rows.map(function(r){return r[2];})) +
        ", last_price_time " + distinct(rows.map(function(r){return r[3];})) +
        ", volume " + distinct(rows.map(function(r){return r[4];})) +
        ", open interest " + distinct(rows.map(function(r){return r[5];})) + "</pre>";
      html += "<div class='wrap'><table><tr><th>UTC time</th><th>Mark</th><th>Last</th><th>Last trade time</th><th>Volume</th><th>OI</th></tr>";
      rows.slice(-25).reverse().forEach(function(r){
        html += "<tr><td>" + new Date(r[0]*1000).toISOString().slice(11,16) + "</td><td>" + r[1] + "</td><td>" + r[2] +
          "</td><td>" + r[3] + "</td><td>" + r[4] + "</td><td>" + r[5] + "</td></tr>";
      });
      html += "</table></div>";
    });
    out.innerHTML = html;
  } catch(e){ out.textContent = "FAILED: " + e.message; }
}
go();
</script>
</body>
</html>
