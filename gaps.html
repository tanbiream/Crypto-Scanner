<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recorder Gaps</title>
<style>
  body{background:#0d1117;color:#e6edf3;font-family:-apple-system,Helvetica,Arial,sans-serif;margin:0;padding:12px;font-size:13px}
  h1{font-size:18px;margin:0 0 2px}
  h2{font-size:15px;margin:16px 0 4px;color:#58a6ff}
  .sub{color:#8b949e;font-size:12px;margin-bottom:10px}
  .bar{padding:9px;border-radius:8px;margin:10px 0}
  .ok{background:#12351f;color:#3fb950}
  .bad{background:#3d1417;color:#f85149}
  .wait{background:#2a2410;color:#d29922}
  select{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:8px;font-size:14px}
  button{background:#238636;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px}
  .wrap{overflow-x:auto;margin-top:6px}
  table{border-collapse:collapse;min-width:50%}
  th,td{text-align:left;padding:6px 10px;border-bottom:1px solid #21262d;white-space:nowrap}
  th{color:#8b949e;font-weight:600}
  pre{background:#161b22;padding:8px;border-radius:6px;white-space:pre-wrap;margin:6px 0}
</style>
</head>
<body>
<h1>Recorder Gaps (futures recorder)</h1>
<div class="sub">Lists every period where the futures recorder did not save a snapshot. Times are in your local time.</div>
<label>Look back <select id="hours"><option value="24">24 hours</option><option value="48">48 hours</option><option value="72" selected>72 hours</option><option value="120">5 days</option></select></label>
<button onclick="run()">Find gaps</button>
<div class="bar wait" id="status">Press "Find gaps".</div>
<pre id="summary"></pre>
<h2>Missing minutes by hour of day</h2>
<div class="wrap" id="byhour"></div>
<h2>Gaps (newest first, up to 200)</h2>
<div class="wrap" id="gaps"></div>
<script>
var BASE = "https://scanner-relay.tanbir-eam-6ff.workers.dev";
function setStatus(cls, t){ var s = document.getElementById("status"); s.className = "bar " + cls; s.textContent = t; }
function fmt(t){ return new Date(t * 1000).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}); }

async function run(){
  var hours = parseInt(document.getElementById("hours").value, 10);
  var now = Math.floor(Date.now() / 1000), from = now - hours * 3600, chunk = 7200;
  var total = Math.ceil((now - from) / chunk), ts = [];
  try{
    for (var c = 0; c < total; c += 4){
      setStatus("wait", "Loading: part " + (c + 1) + " of " + total + "...");
      var ps = [];
      for (var k = c; k < Math.min(total, c + 4); k++){
        var a = from + k * chunk, b = Math.min(now, a + chunk - 1);
        ps.push(fetch(BASE + "/recorder/range?from=" + a + "&to=" + b).then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }));
      }
      var results = await Promise.all(ps);
      results.forEach(function(arr){
        if (!Array.isArray(arr)) throw new Error("Unexpected reply from the Worker.");
        arr.forEach(function(sn){ ts.push(sn[0]); });
      });
    }
    ts.sort(function(x, y){ return x - y; });
    if (ts.length < 2) throw new Error("Not enough snapshots found.");
    var gaps = [], byHour = new Array(24).fill(0), missing = 0, longest = 0, i, j;
    for (i = 1; i < ts.length; i++){
      var d = ts[i] - ts[i - 1];
      if (d > 90){
        var m = Math.round(d / 60) - 1;
        missing += m; if (m > longest) longest = m;
        gaps.push({ start: ts[i - 1] + 60, end: ts[i] - 60, mins: m });
        for (j = 1; j <= m; j++) byHour[new Date((ts[i - 1] + 60 * j) * 1000).getHours()]++;
      }
    }
    var expected = Math.round((ts[ts.length - 1] - ts[0]) / 60) + 1;
    document.getElementById("summary").textContent =
      "Period: " + fmt(ts[0]) + " to " + fmt(ts[ts.length - 1]) + "\n" +
      "Snapshots found: " + ts.length + " of " + expected + " expected (" + (100 * ts.length / expected).toFixed(1) + "% covered)\n" +
      "Missing minutes: " + missing + " in " + gaps.length + " gaps. Longest gap: " + longest + " minutes.";
    var h = "<table><tr><th>Hour of day (local)</th><th>Missing minutes</th></tr>", any = false;
    for (i = 0; i < 24; i++) if (byHour[i]){ any = true; h += "<tr><td>" + (i < 10 ? "0" : "") + i + ":00 to " + (i < 10 ? "0" : "") + i + ":59</td><td>" + byHour[i] + "</td></tr>"; }
    if (!any) h += "<tr><td colspan='2'>No missing minutes.</td></tr>";
    document.getElementById("byhour").innerHTML = h + "</table>";
    gaps.sort(function(x, y){ return y.start - x.start; });
    var g = "<table><tr><th>From</th><th>To</th><th>Minutes missing</th></tr>";
    gaps.slice(0, 200).forEach(function(x){ g += "<tr><td>" + fmt(x.start) + "</td><td>" + fmt(x.end) + "</td><td>" + x.mins + "</td></tr>"; });
    if (!gaps.length) g += "<tr><td colspan='3'>No gaps.</td></tr>";
    document.getElementById("gaps").innerHTML = g + "</table>";
    setStatus(missing ? "wait" : "ok", missing ? "Done: found " + gaps.length + " gaps." : "Done: no gaps in this period.");
  } catch(e){
    setStatus("bad", "FAILED: " + e.message);
  }
}
</script>
</body>
</html>
